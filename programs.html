<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>البرامج | Wissam Digital</title>

<style>
:root{--bg:#061321;--card:#0d2943;--gold:#f5c86a;--text:#f7f9fc;--muted:#b8c3cf;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#061321,#071b2e);color:var(--text)}a{text-decoration:none;color:inherit}.wrap{width:min(1050px,92%);margin:auto}
header{position:sticky;top:0;background:rgba(6,19,33,.94);border-bottom:1px solid var(--line);z-index:5}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--gold)}.nav a{padding:10px 13px;border-radius:11px;border:1px solid var(--line)}
main{padding:52px 0 70px}.title{text-align:center;margin-bottom:30px}.title h1{color:var(--gold);font-size:clamp(30px,6vw,44px);margin:0 0 10px}.title p{color:var(--muted);line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:22px;padding:24px}.card h2,.card h3{color:var(--gold);margin-top:0}.card p{line-height:1.9;color:#dce4eb}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:13px;font-weight:900;background:linear-gradient(135deg,#f8da8e,#d39b34);color:#101721;margin-top:12px}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.steps{line-height:2;color:#e7edf4}.price{font-size:26px;color:var(--gold);font-weight:1000}.muted{color:var(--muted);font-size:13px;line-height:1.7}.heroIcon{font-size:72px;text-align:center}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);text-align:center}
@media(max-width:720px){.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap;padding:10px 0}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">WISSAM DIGITAL — وسام ديجيتال</div><div><a href="index.html">الرئيسية</a></div></div></header>
<main><div class="wrap">
  <div class="title"><h1>البرامج</h1><p>البرامج المتوفرة من وسام ديجيتال.</p></div>
  <div class="grid">
    <article class="card">
      <div class="heroIcon">🌙</div>
      <h2>الأفق — al ufuq</h2>
      <p>تقويم عربي، مواقيت الصلاة، الموقع، الأذان، الأذكار، وأقسام إضافية مع نسخة Plus.</p>
      <a class="btn" href="al-ufuq.html">فتح برنامج الأفق</a>
    </article>
  </div>
</div></main>
<footer>© 2026 وسام محمد — Wissam Digital | جميع حقوق الطبع والنشر محفوظة</footer>
</body></html>
